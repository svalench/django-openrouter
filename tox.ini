[tox]
envlist =
    py311-django42
    py312-django42
    py311-django50
    py312-django50
    py312-django51
    py313-django51
    py312-django52
    py313-django52
    py313-django60
isolated_build = true

[testenv]
extras = dev
deps =
    django42: Django>=4.2,<5
    django50: Django>=5.0,<5.1
    django51: Django>=5.1,<5.2
    django52: Django>=5.2,<6
    django60: Django>=6.0,<7
commands =
    pytest {posargs}

[testenv:lint]
extras = dev
commands =
    ruff check src tests
    mypy src/django_openrouter
