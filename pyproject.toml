[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "django-openrouter"
dynamic = ["version"]
description = "Reusable Django app for managing OpenRouter models, budgets and usage via the admin."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "django-openrouter contributors" }]
keywords = ["django", "openrouter", "llm", "openai", "chat"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Framework :: Django :: 6.0",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
    "httpx>=0.27",
    "cryptography>=42.0.0",
]

[project.optional-dependencies]
async = ["httpx>=0.27"]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "pytest-cov>=5.0",
    "pytest-django>=4.8",
    "respx>=0.21",
    "ruff>=0.6",
    "mypy>=1.11",
    "django-stubs>=5.0",
]

[project.urls]
Homepage = "https://github.com/svalench/django-openrouter"
Documentation = "https://svalench.github.io/django-openrouter/"
Repository = "https://github.com/svalench/django-openrouter"
Issues = "https://github.com/svalench/django-openrouter/issues"

[tool.hatch.version]
path = "src/django_openrouter/__init__.py"

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CONTRIBUTING.md",
    "/LICENSE",
]

[tool.hatch.build.targets.wheel]
packages = ["src/django_openrouter"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["src", "."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["django_openrouter"]
omit = [
    "*/migrations/*",
    "*/tests/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 85
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

[tool.ruff]
target-version = "py311"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "DJ", "RUF"]
ignore = ["RUF012", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["django_openrouter"]

[tool.ruff.lint.per-file-ignores]
"src/django_openrouter/migrations/*" = ["E501", "I001"]
"tests/*" = ["DJ01"]

[tool.mypy]
python_version = "3.11"
plugins = ["mypy_django_plugin.main"]
pretty = true
show_error_codes = true
warn_unused_ignores = true
warn_redundant_casts = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
exclude = ["src/django_openrouter/migrations/"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false

[tool.django-stubs]
django_settings_module = "tests.settings"
